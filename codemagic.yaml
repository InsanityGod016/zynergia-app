workflows:
  ios-distribution:
    name: iOS Distribution
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - ios_credentials
        - app_environment
      vars:
        ONESIGNAL_DISABLE_LOCATION: true
        VITE_SUPPORT_EMAIL: equipo@coreflowia.com
        VITE_APP_STORE_URL: https://apps.apple.com/mx/app/zynergia/id6761772857?l=en-GB
        VITE_PLAY_STORE_URL: https://play.google.com/store/apps/details?id=com.zynergia.app
        VITE_ONESIGNAL_APP_ID: a7228dd0-b242-450b-b0d0-6bf903b43919
      node: 22.14.0
      xcode: 26.6
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Static checks
        script: |
          npm run lint
          npm run typecheck
          npm run typecheck:backend
          npm test
      - name: Release safety gate
        script: |
          RELEASE_GATE_MODE=artifact node supabase/scripts/predeploy-gate.mjs supabase/schema.production.json
      - name: Build native web assets
        script: |
          npm run build:native
          npm run verify:native-bundle
      - name: Strip web-only assets (landing animation = 27MB)
        script: rm -rf dist/animations
      - name: Capacitor sync
        script: npx cap sync ios
      - name: Set up code signing
        script: |
          set -euo pipefail
          trap 'rm -f /tmp/certificate.p12 /tmp/profile.mobileprovision /tmp/profile.mobileprovision.plist /tmp/nse-profile.mobileprovision /tmp/nse-profile.mobileprovision.plist' EXIT
          keychain initialize
          printf '%s' "$CM_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          keychain add-certificates --certificate /tmp/certificate.p12 --certificate-password "$CM_CERTIFICATE_PASSWORD"
          printf '%s' "$CM_PROVISIONING_PROFILE_V2" | base64 --decode > /tmp/profile.mobileprovision
          printf '%s' "$CM_NSE_PROVISIONING_PROFILE" | base64 --decode > /tmp/nse-profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          install_profile() {
            profile="$1"
            expected_identifier="$2"
            decoded="${profile}.plist"
            security cms -D -i "$profile" > "$decoded"

            identifier=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$decoded")
            if [ "$identifier" != "NR7VZQ9R89.$expected_identifier" ]; then
              echo "Provisioning profile does not match $expected_identifier."
              exit 1
            fi

            /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' "$decoded" \
              | grep -Fq 'group.com.zynergia.app.onesignal' || {
                echo "Provisioning profile for $expected_identifier is missing the OneSignal App Group."
                exit 1
              }

            get_task_allow=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$decoded")
            if [ "$get_task_allow" != false ]; then
              echo "Provisioning profile for $expected_identifier is not a distribution profile."
              exit 1
            fi

            uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$decoded")
            cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          }

          profile_allows_associated_domain() {
            decoded_profile="$1"
            required_domain="$2"
            profile_domains=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.associated-domains' "$decoded_profile" 2>/dev/null) || {
              echo "The App provisioning profile does not authorize Associated Domains."
              exit 1
            }
            printf '%s\n' "$profile_domains" | awk -v required="$required_domain" '
              {
                value = $0
                sub(/^[[:space:]]+/, "", value)
                sub(/[[:space:]]+$/, "", value)
                if (value == "*" || value == required) found = 1
              }
              END { exit(found ? 0 : 1) }
            ' || {
              echo "The App provisioning profile does not authorize $required_domain."
              exit 1
            }
          }

          install_profile /tmp/profile.mobileprovision com.zynergia.app
          install_profile /tmp/nse-profile.mobileprovision com.zynergia.app.OneSignalNotificationServiceExtension

          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.associated-domains' ios/App/App/App.entitlements \
            | grep -Fq 'applinks:zynergia.pro' || {
              echo "App.entitlements is missing the zynergia.pro Universal Link domain."
              exit 1
            }
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.associated-domains' ios/App/App/App.entitlements \
            | grep -Fq 'webcredentials:zynergia.pro' || {
              echo "App.entitlements is missing the zynergia.pro web credentials domain."
              exit 1
            }

          profile_allows_associated_domain /tmp/profile.mobileprovision.plist 'applinks:zynergia.pro'
          profile_allows_associated_domain /tmp/profile.mobileprovision.plist 'webcredentials:zynergia.pro'

          app_push_environment=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' /tmp/profile.mobileprovision.plist)
          if [ "$app_push_environment" != production ]; then
            echo "The App provisioning profile is not enabled for production push notifications."
            exit 1
          fi

          xcode-project use-profiles
      - name: Build iOS
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App \
            --config Release
      - name: Publish to TestFlight
        script: |
          set -euo pipefail
          trap 'rm -f /tmp/api_key.p8' EXIT
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" | base64 --decode > /tmp/api_key.p8
          ipa_count=$(find build/ios/ipa -type f -name '*.ipa' | wc -l | tr -d '[:space:]')
          if [ "$ipa_count" -ne 1 ]; then
            echo "Expected exactly one IPA, found $ipa_count."
            exit 1
          fi
          ipa_path=$(find build/ios/ipa -type f -name '*.ipa' -print -quit)
          app-store-connect publish \
            --path "$ipa_path" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key @file:/tmp/api_key.p8 \
            --testflight \
            --max-find-build-wait 30
    artifacts:
      - build/ios/ipa/*.ipa

  android-verify-keystore:
    name: Verify Android Upload Keystore
    max_build_duration: 5
    instance_type: mac_mini_m2
    environment:
      groups:
        - android_credentials
        - ios_credentials
      xcode: 26.6
      java: 21
    scripts:
      - name: Verify reset upload key
        script: |
          set -euo pipefail
          trap 'rm -f /tmp/zynergia-upload.keystore' EXIT
          source scripts/resolve-android-upload-key.sh

  android-distribution:
    name: Android Distribution
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - android_credentials
        - ios_credentials
        - app_environment
      vars:
        ONESIGNAL_DISABLE_LOCATION: true
        VITE_SUPPORT_EMAIL: equipo@coreflowia.com
        VITE_APP_STORE_URL: https://apps.apple.com/mx/app/zynergia/id6761772857?l=en-GB
        VITE_PLAY_STORE_URL: https://play.google.com/store/apps/details?id=com.zynergia.app
        VITE_ONESIGNAL_APP_ID: a7228dd0-b242-450b-b0d0-6bf903b43919
      node: 22.14.0
      xcode: 26.6
      java: 21
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Static checks
        script: |
          npm run lint
          npm run typecheck
          npm run typecheck:backend
          npm test
      - name: Release safety gate
        script: |
          RELEASE_GATE_MODE=artifact node supabase/scripts/predeploy-gate.mjs supabase/schema.production.json
      - name: Build native web assets
        script: |
          npm run build:native
          npm run verify:native-bundle
      - name: Strip web-only assets (landing animation = 27MB)
        script: rm -rf dist/animations
      - name: Capacitor sync
        script: npx cap sync android
      - name: Set up keystore
        script: |
          set -euo pipefail
          source scripts/resolve-android-upload-key.sh
      - name: Build Android App Bundle
        script: |
          set -euo pipefail
          trap 'rm -f /tmp/zynergia-upload.keystore' EXIT
          source scripts/resolve-android-upload-key.sh
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$ANDROID_RESOLVED_KEYSTORE \
            -Pandroid.injected.signing.store.password=$ANDROID_RESOLVED_KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$ANDROID_RESOLVED_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$ANDROID_RESOLVED_KEYSTORE_PASSWORD
    artifacts:
      - android/app/build/outputs/bundle/release/app-release.aab
