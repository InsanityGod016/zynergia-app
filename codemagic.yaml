workflows:
  ios-distribution:
    name: iOS Distribution
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - ios_credentials
        - app_environment
      node: 22.14.0
      xcode: 26.6
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Static checks
        script: |
          npm run lint
          npm run typecheck
          npm run typecheck:backend
          npm test
      - name: Release safety gate
        script: |
          RELEASE_GATE_MODE=artifact node supabase/scripts/predeploy-gate.mjs supabase/schema.production.json
      - name: Build native web assets
        script: |
          npm run build:native
          npm run verify:native-bundle
      - name: Strip web-only assets (landing animation = 27MB)
        script: rm -rf dist/animations
      - name: Capacitor sync
        script: npx cap sync ios
      - name: Set up code signing
        script: |
          set -euo pipefail
          keychain initialize
          printf '%s' "$CM_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          keychain add-certificates --certificate /tmp/certificate.p12 --certificate-password $CM_CERTIFICATE_PASSWORD
          printf '%s' "$CM_PROVISIONING_PROFILE" | base64 --decode > /tmp/profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(grep -a -A1 'UUID' /tmp/profile.mobileprovision | grep string | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          xcode-project use-profiles
      - name: Build iOS
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App \
            --config Release
      - name: Publish to TestFlight
        script: |
          set -euo pipefail
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" | base64 --decode > /tmp/api_key.p8
          app-store-connect publish \
            --path $(find build/ios/ipa -name "*.ipa") \
            --key-id $APP_STORE_CONNECT_KEY_IDENTIFIER \
            --issuer-id $APP_STORE_CONNECT_ISSUER_ID \
            --private-key @file:/tmp/api_key.p8 \
            --testflight \
            --max-find-build-wait 30
    artifacts:
      - build/ios/ipa/*.ipa

  android-verify-keystore:
    name: Verify Original Keystore Password
    max_build_duration: 5
    instance_type: mac_mini_m2
    environment:
      groups:
        - android_credentials
      xcode: 26.6
      java: 21
    scripts:
      - name: Verify ANDROID_KEYSTORE + ANDROID_KEY_PASSWORD
        script: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > /tmp/original.jks
          keytool -list -v \
            -keystore /tmp/original.jks \
            -storepass "$ANDROID_KEY_PASSWORD" \
            -alias zynergia > /tmp/keystore-report.txt
          grep -E "SHA1|SHA-256|Alias" /tmp/keystore-report.txt

  android-distribution:
    name: Android Distribution
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - android_credentials
        - app_environment
      node: 22.14.0
      xcode: 26.6
      java: 21
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Static checks
        script: |
          npm run lint
          npm run typecheck
          npm run typecheck:backend
          npm test
      - name: Release safety gate
        script: |
          RELEASE_GATE_MODE=artifact node supabase/scripts/predeploy-gate.mjs supabase/schema.production.json
      - name: Build native web assets
        script: |
          npm run build:native
          npm run verify:native-bundle
      - name: Strip web-only assets (landing animation = 27MB)
        script: rm -rf dist/animations
      - name: Capacitor sync
        script: npx cap sync android
      - name: Set up keystore
        script: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > /tmp/zynergia-upload.jks
          keytool -list \
            -keystore /tmp/zynergia-upload.jks \
            -storepass "$ANDROID_KEY_PASSWORD" \
            -alias zynergia > /dev/null
      - name: Build Android App Bundle
        script: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=/tmp/zynergia-upload.jks \
            -Pandroid.injected.signing.store.password=$ANDROID_KEY_PASSWORD \
            -Pandroid.injected.signing.key.alias=zynergia \
            -Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD
    artifacts:
      - android/app/build/outputs/bundle/release/app-release.aab
